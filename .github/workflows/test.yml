name: CI
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run go vet
        run: go vet ./...
      - name: Run go test
        run: go test ./...
